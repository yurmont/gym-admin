services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gym_admin
      POSTGRES_USER: gym_admin
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - gym-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_admin -d gym_admin"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  gym-postgres:
